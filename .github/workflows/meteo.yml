name: Bot Metereologia Diário

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          pip install requests schedule

      - name: Executar o Bot
        run: |
          python bot.meteo.py.py
